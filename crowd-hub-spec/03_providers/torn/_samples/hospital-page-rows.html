<!--
  Sample: torn.com/hospitalview.php — Hospital List Rows
  Captured: 2026-11-14 from live torn.com (logged-in session, UI Automation JS injection)
  Source selector: ul.user-info-list-wrap > li  (confirmed working, 3 rows captured)

  DOM structure notes:
  - The hospital list is a <ul class="user-info-list-wrap"> containing <li> items.
  - Each <li> has:
      - ul#iconTray   → online/offline status icon
      - span.user-wrap.user-faction → faction tag image (href to faction profile)
      - span.user-wrap.user-name   → player name link (href /profiles.php?XID=<id>)
          - data-placeholder="<name> [<XID>]"  ← reliable XID extraction point
      - span.info-wrap → hospital details:
          - span.time   → time remaining in hospital (e.g. "83h 17m")
          - span.level  → player level
          - span.reason → hospitalization reason (e.g. "Overdosed on Xanax")
      - a.revive → revive button (class "reviveNotAvailable" or "revive" when available)
  - li.gray = alternating row background (every other row)

  TornSelectors.kt: use "ul.user-info-list-wrap > li" as the primary selector.
  For player XID: parse href="/profiles.php?XID=<id>" or data-placeholder="Name [XID]"
  For time remaining: span.time text content (strip leading/trailing whitespace)
  For reason: span.reason text content
  For online status: li.iconShow[aria-label] inside ul#iconTray → "Online" / "Offline" / "Idle"
-->
